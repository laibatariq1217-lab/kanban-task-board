<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Interactive Kanban Board</h1>
        <div class="actions">
            <button id="add-list-btn" onclick="addNewList()">+ Add New List</button>
            <button id="add-card-btn" onclick="openModal()">+ Add New Task</button>
        </div>
    </header>

    <div class="board" id="board">
        <div class="column" ondragover="allowDrop(event)" ondrop="drop(event)">
            <h3>Incompleted</h3>
            <div class="cards-container"></div>
        </div>
        <div class="column" ondragover="allowDrop(event)" ondrop="drop(event)">
            <h3>Completed</h3>
            <div class="cards-container"></div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Add Task</h2>
            <input type="text" id="taskTitle" placeholder="Task Title">
            <textarea id="taskDesc" placeholder="Task Description"></textarea>
            <button onclick="createTask()">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
